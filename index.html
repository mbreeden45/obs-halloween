<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halloween Watch Party Overlay</title>
<meta name="viewport" content="width=1920, height=1080, initial-scale=1">
<!--
  Halloween football watch-party overlay for OBS Browser Source.
  - Set the Browser Source to 1920x1080 and point it at this file (Local file) or localhost.
  - No external dependencies. Background is fully transparent.

  Optional URL parameters (e.g. index.html?debug=1&batMin=5):
    debug=1             Preview mode: fake turf background + outlines of the protected broadcast zones.
                        Keys: L = lightning, B = bat swoop.
    fog=0 | bats=0 | webs=0 | lightning=0 | spider=0   Disable an individual effect.
    fogDensity=1        Fog opacity multiplier (e.g. 0.6 lighter, 1.4 heavier).
    batMin=9 batMax=22  Seconds between bat swoops (random in range).
    lightningMin=30 lightningMax=60   Seconds between lightning flashes (random in range).
    lightningStrength=1 Flash brightness multiplier.
    fps=0               Cap the canvas frame rate (0 = match display, e.g. 30 to save CPU/GPU).
-->
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  #stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    pointer-events: none;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    display: block;
    margin: 0;
    background: transparent;
  }

  /* ---------- Corner spiderwebs ---------- */
  .web {
    position: absolute;
    top: 0;
    width: 290px;
    height: 290px;
    opacity: 0.8;
  }
  .web.left  { left: 0; }
  .web.right { right: 0; transform: scaleX(-1); }   /* mirror into the top-right corner */
  .web svg {
    display: block;
    overflow: hidden;
    transform-origin: 0 0;
    animation: web-sway 11s ease-in-out infinite;
  }
  .web.right svg { animation-duration: 13s; animation-delay: -4s; }

  @keyframes web-sway {
    0%, 100% { transform: rotate(0deg) scale(1); }
    50%      { transform: rotate(0.6deg) scale(1.008); }
  }

  .dew { animation: dew-glint 6s ease-in-out infinite; }
  @keyframes dew-glint {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 0.85; }
  }

  .spider { animation: spider-bob 14s ease-in-out infinite; }
  @keyframes spider-bob {
    0%, 100% { transform: translateY(0); }
    30%      { transform: translateY(-6px); }
    55%      { transform: translateY(34px); }
    70%      { transform: translateY(30px); }
  }

  /* ---------- Lightning flash ---------- */
  #flash {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    opacity: 0;
    pointer-events: none;
  }
  #flash.strike { animation: strike 0.8s ease-out 1 both; }
  @keyframes strike {
    0%   { opacity: 0; }
    6%   { opacity: 1; }
    16%  { opacity: 0.12; }
    26%  { opacity: 0.75; }
    46%  { opacity: 0.05; }
    56%  { opacity: 0.3; }
    100% { opacity: 0; }
  }

  /* ---------- Debug / preview mode only ---------- */
  body.debug {
    background:
      repeating-linear-gradient(90deg, transparent 0 158px, rgba(255,255,255,0.18) 158px 162px),
      linear-gradient(180deg, #1f4a22 0%, #2f6a2f 55%, #26592a 100%);
  }
  .zone {
    position: absolute;
    box-sizing: border-box;
    border: 2px dashed rgba(255, 210, 60, 0.9);
    background: rgba(255, 210, 60, 0.07);
    color: rgba(255, 230, 140, 0.95);
    font: 600 18px/1.3 system-ui, sans-serif;
    padding: 8px 12px;
  }
  .debug-help {
    position: absolute;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.85);
    font: 500 22px/1.5 system-ui, sans-serif;
    text-align: center;
    text-shadow: 0 1px 3px #000;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div class="web left"  id="webLeft"></div>
  <div class="web right" id="webRight"></div>
  <div id="flash"></div>
</div>

<script>
(() => {
  'use strict';

  const W = 1920, H = 1080;

  /* ------------------------------------------------------------------ *
   * Configuration (overridable with URL params, see header comment)
   * ------------------------------------------------------------------ */
  const params = new URLSearchParams(window.location.search);
  const num = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };
  const flag = (k, d) => {
    if (!params.has(k)) return d;
    const v = (params.get(k) || '').toLowerCase();
    return !(v === '0' || v === 'false' || v === 'off' || v === 'no');
  };

  const CONFIG = {
    debug:             flag('debug', false),
    fog:               flag('fog', true),
    bats:              flag('bats', true),
    webs:              flag('webs', true),
    spider:            flag('spider', true),
    lightning:         flag('lightning', true),
    fogDensity:        Math.max(0, num('fogDensity', 1)),
    fogPuffs:          60,
    batMin:            Math.max(1, num('batMin', 9)),
    batMax:            Math.max(1, num('batMax', 22)),
    lightningMin:      Math.max(2, num('lightningMin', 30)),
    lightningMax:      Math.max(2, num('lightningMax', 60)),
    lightningStrength: Math.max(0, num('lightningStrength', 1)),
    fps:               Math.max(0, num('fps', 0)),

    // Fog is only drawn in the bottom third, then knocked out of these zones
    // so the broadcast score bug / down & distance / game clock stay readable.
    // strength = fraction of fog removed inside the zone (soft feathered edges).
    clearZones: [
      { label: 'Score bug / down & distance', x: 500,  y: 850, w: 900, h: 230, strength: 0.9 },
      { label: 'Game clock / network bug',    x: 1400, y: 770, w: 520, h: 310, strength: 0.92 },
    ],
    // Bats fly below this line so top-of-screen broadcast graphics stay clear.
    topClearHeight: 120,
  };

  const rand  = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

  /* ------------------------------------------------------------------ *
   * Stage scaling (1:1 at 1920x1080, scales if the source size differs)
   * ------------------------------------------------------------------ */
  const stage = document.getElementById('stage');
  function fitStage() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H) || 1;
    stage.style.transform = s === 1 ? 'none' : `scale(${s})`;
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');

  /* ------------------------------------------------------------------ *
   * FOG / MIST
   * ------------------------------------------------------------------ */
  function makePuffSprite(r, g, b) {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const x = c.getContext('2d');
    const gr = x.createRadialGradient(128, 128, 0, 128, 128, 128);
    gr.addColorStop(0.00, `rgba(${r},${g},${b},1)`);
    gr.addColorStop(0.35, `rgba(${r},${g},${b},0.6)`);
    gr.addColorStop(0.70, `rgba(${r},${g},${b},0.18)`);
    gr.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
    x.fillStyle = gr;
    x.fillRect(0, 0, 256, 256);
    return c;
  }
  // Mostly cool lavender-grey mist with the occasional eerie green wisp.
  const SPRITES = [
    makePuffSprite(206, 202, 226),
    makePuffSprite(188, 182, 216),
    makePuffSprite(204, 206, 222),
    makePuffSprite(168, 198, 182),
  ];
  const pickSprite = () => {
    const r = Math.random();
    return r < 0.38 ? SPRITES[0] : r < 0.72 ? SPRITES[1] : r < 0.9 ? SPRITES[2] : SPRITES[3];
  };

  function newPuff(initial) {
    const r = rand(130, 300);
    const sx = rand(1.5, 2.8);              // stretched horizontally = low-lying fog bank
    const sy = rand(0.4, 0.75);
    const depth = Math.pow(Math.random(), 1.6);   // 0 = hugging the bottom edge
    const halfW = r * sx;
    return {
      r, sx, sy,
      x: initial ? rand(-halfW, W + halfW) : -halfW - rand(0, 250),
      y0: H + 30 - depth * 330,
      vx: rand(6, 18) * (0.75 + depth * 0.6),   // upper wisps drift slightly faster
      a: rand(0.045, 0.09),
      sprite: pickSprite(),
      bobA: rand(4, 14), bobW: rand(0.05, 0.14), ph: rand(0, Math.PI * 2),
      brW: rand(0.07, 0.18), ph2: rand(0, Math.PI * 2),
    };
  }
  const puffs = [];
  for (let i = 0; i < CONFIG.fogPuffs; i++) puffs.push(newPuff(true));

  // Pre-rendered soft mask used to erase fog from the protected broadcast zones.
  function buildClearMask() {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const m = c.getContext('2d');
    const OFF = 10000;           // draw the rect off-canvas, keep only its blurred shadow
    m.shadowOffsetX = OFF;
    m.shadowBlur = 80;
    m.fillStyle = '#000';
    for (const z of CONFIG.clearZones) {
      let { x, y, w, h } = z;
      // Extend zones that touch a screen edge so the feathering doesn't fade there.
      if (x <= 0)      { x -= 200; w += 200; }
      if (x + w >= W)  { w += 200; }
      if (y + h >= H)  { h += 200; }
      m.shadowColor = `rgba(0,0,0,${z.strength})`;
      m.fillRect(x - OFF, y, w, h);
    }
    return c;
  }
  const clearMask = buildClearMask();

  function drawFog(t, dt, glow) {
    const boost = CONFIG.fogDensity * (1 + glow * 1.4);   // fog lights up during lightning
    for (let i = 0; i < puffs.length; i++) {
      let p = puffs[i];
      p.x += p.vx * dt;
      const w = p.r * 2 * p.sx, h = p.r * 2 * p.sy;
      if (p.x - w / 2 > W) { p = puffs[i] = newPuff(false); continue; }

      const y = p.y0 + Math.sin(t * p.bobW + p.ph) * p.bobA;
      let a = p.a * (0.7 + 0.3 * Math.sin(t * p.brW + p.ph2)) * boost;
      a *= smoothstep(700, 880, y);          // fade out toward the top of the bottom third
      if (a <= 0.001) continue;
      ctx.globalAlpha = Math.min(1, a);
      ctx.drawImage(p.sprite, p.x - w / 2, y - h / 2, w, h);
    }
    ctx.globalAlpha = 1;

    // Knock the fog out of the score bug / clock zones (soft edges).
    ctx.globalCompositeOperation = 'destination-out';
    ctx.drawImage(clearMask, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ------------------------------------------------------------------ *
   * BATS
   * ------------------------------------------------------------------ */
  const bats = [];
  let nextSwoop = rand(4, 8);   // first swoop shortly after load

  function spawnSwoop() {
    const r = Math.random();
    const n = r < 0.45 ? 1 : r < 0.78 ? 2 : r < 0.93 ? 3 : 4;
    const dir = Math.random() < 0.5 ? 1 : -1;
    const top = CONFIG.topClearHeight + 30;
    const baseY = rand(top, top + 150);
    const dip = Math.random() < 0.8 ? rand(40, 120) : -rand(10, 25);   // mostly swoop down then up
    const speed = rand(380, 600);
    let lag = 0;
    for (let i = 0; i < n; i++) {
      const x = dir > 0 ? -60 - lag : W + 60 + lag;
      bats.push({
        dir, x, px: x,
        baseY: baseY + rand(-30, 30),
        y: baseY, py: baseY,
        dip: dip * rand(0.8, 1.2),
        speed: speed * rand(0.92, 1.08),
        size: rand(15, 25),                 // half-wingspan in px
        flapF: rand(6.5, 10),
        ph: rand(0, Math.PI * 2),
        wobF: rand(1.5, 3), wobPh: rand(0, Math.PI * 2),
        glideF: rand(0.6, 1.1),
      });
      lag += rand(50, 160);
    }
  }

  function batWing(m, f) {
    const tipY = -0.62 * f;
    const jY = -0.28 * f;
    ctx.moveTo(0.06 * m, -0.08);
    ctx.quadraticCurveTo(0.30 * m, -0.27 + jY * 0.6, 0.48 * m, -0.12 + jY);   // leading edge to wrist
    ctx.lineTo(1.00 * m, -0.05 + tipY);                                       // wing tip
    // scalloped trailing edge back to the body
    ctx.quadraticCurveTo(0.82 * m, 0.00 + tipY * 0.6, 0.76 * m, 0.14 + tipY * 0.55);
    ctx.quadraticCurveTo(0.62 * m, 0.06 + jY * 0.8,   0.50 * m, 0.20 + jY * 0.7);
    ctx.quadraticCurveTo(0.36 * m, 0.10 + jY * 0.4,   0.24 * m, 0.24 + jY * 0.3);
    ctx.quadraticCurveTo(0.14 * m, 0.14,              0.05 * m, 0.14);
    ctx.closePath();
  }

  function drawBat(x, y, s, f, tilt) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    ctx.scale(s, s);
    ctx.beginPath();
    batWing(1, f);
    batWing(-1, f);
    // body
    ctx.moveTo(0.085, 0.04);
    ctx.ellipse(0, 0.04, 0.085, 0.16, 0, 0, Math.PI * 2);
    // head
    ctx.moveTo(0.07, -0.13);
    ctx.arc(0, -0.13, 0.07, 0, Math.PI * 2);
    // ears
    ctx.moveTo(-0.06, -0.16); ctx.lineTo(-0.08, -0.27); ctx.lineTo(-0.02, -0.19); ctx.closePath();
    ctx.moveTo( 0.06, -0.16); ctx.lineTo( 0.08, -0.27); ctx.lineTo( 0.02, -0.19); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function updateBats(t, dt) {
    if (t >= nextSwoop) {
      spawnSwoop();
      nextSwoop = t + rand(CONFIG.batMin, Math.max(CONFIG.batMin, CONFIG.batMax));
    }
    if (!bats.length) return;

    ctx.fillStyle = 'rgba(12, 7, 16, 0.85)';
    ctx.shadowColor = 'rgba(150, 100, 210, 0.35)';   // faint rim so bats read on dark shots too
    ctx.shadowBlur = 6;

    for (let i = bats.length - 1; i >= 0; i--) {
      const b = bats[i];
      b.px = b.x; b.py = b.y;
      b.x += b.dir * b.speed * dt;
      const u = clamp(b.dir > 0 ? b.x / W : 1 - b.x / W, 0, 1);
      b.y = b.baseY + b.dip * Math.sin(Math.PI * u) + Math.sin(t * b.wobF + b.wobPh) * 9;

      if ((b.dir > 0 && b.x > W + 80) || (b.dir < 0 && b.x < -80)) { bats.splice(i, 1); continue; }

      // Flap, with occasional short glides.
      const glide = Math.max(0, Math.sin(t * b.glideF + b.ph)) > 0.85 ? 0.25 : 1;
      const f = Math.sin(t * b.flapF * Math.PI * 2 + b.ph) * glide + (1 - glide) * 0.35;
      const tilt = Math.atan2(b.y - b.py, Math.abs(b.x - b.px) || 1) * 0.6 * b.dir;
      drawBat(b.x, b.y, b.size, f, tilt);
    }

    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
  }

  /* ------------------------------------------------------------------ *
   * LIGHTNING
   * ------------------------------------------------------------------ */
  const flash = document.getElementById('flash');
  let flashStart = -1e9;

  function strike() {
    const k = CONFIG.lightningStrength;
    // Light comes from one of the upper corners, never dead-center over the score bug.
    const fromX = Math.random() < 0.5 ? rand(4, 28) : rand(72, 96);
    flash.style.background =
      `radial-gradient(ellipse 85% 80% at ${fromX}% -12%,` +
      ` rgba(242,236,255,${(0.55 * k).toFixed(3)}) 0%,` +
      ` rgba(190,150,255,${(0.32 * k).toFixed(3)}) 32%,` +
      ` rgba(125,75,205,${(0.14 * k).toFixed(3)}) 62%,` +
      ` rgba(80,40,160,0) 100%)`;
    const dur = rand(0.65, 0.95);
    flash.style.animationDuration = dur.toFixed(2) + 's';
    flash.classList.remove('strike');
    void flash.offsetWidth;            // restart the CSS animation
    flash.classList.add('strike');
    flashStart = performance.now();
  }

  function scheduleLightning() {
    const min = CONFIG.lightningMin, max = Math.max(CONFIG.lightningMin, CONFIG.lightningMax);
    setTimeout(() => { strike(); scheduleLightning(); }, rand(min, max) * 1000);
  }

  function lightningGlow(now) {
    const e = now - flashStart;
    if (e < 0 || e > 900) return 0;
    return Math.pow(1 - e / 900, 2);
  }

  /* ------------------------------------------------------------------ *
   * SPIDERWEBS (generated SVG, seeded so they look the same every load)
   * ------------------------------------------------------------------ */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function buildWebSVG(seed, S, withSpider) {
    const R = mulberry32(seed);
    const r = (a, b) => a + (b - a) * R();
    const f = (v) => v.toFixed(1);

    const hx = r(10, 20), hy = r(8, 16);
    const N = 9;
    const angles = [], lens = [];
    for (let i = 0; i < N; i++) {
      const base = 0.05 + (i / (N - 1)) * (Math.PI / 2 - 0.1);
      const jit = (i === 0 || i === N - 1) ? 0 : r(-0.06, 0.06);
      angles.push(base + jit);
      lens.push(S * r(0.8, 1.05));
    }

    let spokes = '', rings = '', strands = '';
    const dews = [];
    const pt = (a, d) => [hx + Math.cos(a) * d, hy + Math.sin(a) * d];

    for (let i = 0; i < N; i++) {
      const [x, y] = pt(angles[i], lens[i]);
      spokes += `M${f(hx)},${f(hy)}L${f(x)},${f(y)}`;
    }
    // Anchor threads tying the outermost spokes to the screen edges.
    { const [x, y] = pt(angles[0], lens[0] * 0.7);     spokes += `M${f(x)},${f(y)}L${f(x + r(15, 40))},0`; }
    { const [x, y] = pt(angles[N - 1], lens[N - 1] * 0.7); spokes += `M${f(x)},${f(y)}L0,${f(y + r(15, 40))}`; }

    // Capture spiral: sagging arcs between neighbouring spokes.
    let rad = S * 0.05;
    for (let k = 0; k < 12; k++) {
      rad += S * r(0.065, 0.085);
      for (let i = 0; i < N - 1; i++) {
        if (rad > Math.min(lens[i], lens[i + 1]) * 0.95) continue;
        const r1 = rad * r(0.97, 1.03), r2 = rad * r(0.97, 1.03);
        const [x1, y1] = pt(angles[i], r1);
        const [x2, y2] = pt(angles[i + 1], r2);
        if (R() < 0.06) {
          // broken thread, left dangling for that abandoned-gothic look
          strands += `M${f(x1)},${f(y1)}Q${f(x1 + r(-6, 6))},${f(y1 + 14)} ${f(x1 + r(-3, 3))},${f(y1 + r(18, 40))}`;
          continue;
        }
        const mid = (angles[i] + angles[i + 1]) / 2;
        const [cx, cy] = pt(mid, rad * r(0.83, 0.9));
        rings += `M${f(x1)},${f(y1)}Q${f(cx)},${f(cy)} ${f(x2)},${f(y2)}`;
        if (R() < 0.05) dews.push([x1, y1, r(1.1, 2)]);
      }
    }

    const thread = 'rgba(232,226,246,';
    let svg =
      `<svg xmlns="http://www.w3.org/2000/svg" width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">` +
      `<g fill="none" stroke-linecap="round">` +
        // dark under-stroke keeps the thin threads visible over bright shots
        `<g stroke="rgba(0,0,0,0.32)" stroke-width="2.6">` +
          `<path d="${spokes}"/><path d="${rings}"/><path d="${strands}"/>` +
        `</g>` +
        `<path d="${spokes}" stroke="${thread}0.55)" stroke-width="1.3"/>` +
        `<path d="${rings}" stroke="${thread}0.42)" stroke-width="0.9"/>` +
        `<path d="${strands}" stroke="${thread}0.35)" stroke-width="0.8"/>` +
      `</g>`;

    for (const [x, y, rr] of dews) {
      svg += `<circle class="dew" cx="${f(x)}" cy="${f(y)}" r="${f(rr)}" fill="rgba(240,236,255,0.9)" ` +
             `style="animation-delay:${(-R() * 6).toFixed(2)}s"/>`;
    }

    if (withSpider) {
      const sx = f(S * 0.46), restY = S * 0.68;
      svg +=
        `<g transform="translate(${sx},0)"><g class="spider">` +
          `<line x1="0" y1="-${S}" x2="0" y2="${f(restY - 4)}" stroke="${thread}0.5)" stroke-width="0.8"/>` +
          `<g transform="translate(0,${f(restY)})" fill="#0e0913" stroke="#0e0913" stroke-linecap="round">` +
            `<g fill="none" stroke-width="1.2">` +
              `<path d="M-2,-2Q-8,-9 -12,-4M-2,-0.5Q-9,-5 -13,1M-2,1Q-9,1 -12,6M-2,2.5Q-7,5 -9,10"/>` +
              `<path d="M2,-2Q8,-9 12,-4M2,-0.5Q9,-5 13,1M2,1Q9,1 12,6M2,2.5Q7,5 9,10"/>` +
            `</g>` +
            `<ellipse cx="0" cy="-1.5" rx="2.8" ry="2.6" stroke="rgba(200,180,235,0.35)" stroke-width="0.6"/>` +
            `<ellipse cx="0" cy="4.2" rx="4.2" ry="5.2" stroke="rgba(200,180,235,0.35)" stroke-width="0.6"/>` +
          `</g>` +
        `</g></g>`;
    }

    return svg + `</svg>`;
  }

  if (CONFIG.webs) {
    document.getElementById('webLeft').innerHTML  = buildWebSVG(1031, 290, CONFIG.spider);
    document.getElementById('webRight').innerHTML = buildWebSVG(31337, 260, false);
  }

  /* ------------------------------------------------------------------ *
   * Debug / preview mode
   * ------------------------------------------------------------------ */
  if (CONFIG.debug) {
    document.body.classList.add('debug');
    const zones = CONFIG.clearZones.concat([
      { label: 'Top broadcast graphics (bats stay below)', x: 0, y: 0, w: W, h: CONFIG.topClearHeight },
    ]);
    for (const z of zones) {
      const d = document.createElement('div');
      d.className = 'zone';
      Object.assign(d.style, { left: z.x + 'px', top: z.y + 'px', width: z.w + 'px', height: z.h + 'px' });
      d.textContent = z.label;
      stage.insertBefore(d, canvas);
    }
    const help = document.createElement('div');
    help.className = 'debug-help';
    help.innerHTML = 'PREVIEW MODE &mdash; remove <b>?debug=1</b> for OBS<br>Press <b>L</b> for lightning, <b>B</b> for bats';
    stage.insertBefore(help, canvas);
  }
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'l') strike();
    if (k === 'b') spawnSwoop();
  });

  /* ------------------------------------------------------------------ *
   * Main loop
   * ------------------------------------------------------------------ */
  const minFrameMs = CONFIG.fps > 0 ? 1000 / CONFIG.fps : 0;
  let last = performance.now();
  let lastDraw = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    if (minFrameMs && now - lastDraw < minFrameMs - 1) return;
    lastDraw = now;

    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now;
    const t = now / 1000;

    ctx.clearRect(0, 0, W, H);
    if (CONFIG.fog)  drawFog(t, dt, lightningGlow(now));
    if (CONFIG.bats) updateBats(t, dt);
  }

  if (CONFIG.lightning) scheduleLightning();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
